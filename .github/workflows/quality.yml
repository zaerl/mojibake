name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install clang-format
        run: |
          pipx install clang-format==21.1.8
          pipx_bin_dir=$(pipx environment --value PIPX_BIN_DIR)
          echo "$pipx_bin_dir" >> "$GITHUB_PATH"
          "$pipx_bin_dir/clang-format" --version

      - name: Check clang-format
        run: |
          git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' |
            xargs -0 clang-format --dry-run --Werror

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/api/package-lock.json
            utils/generate/package-lock.json

      - name: Install generator dependencies
        working-directory: utils/generate
        run: npm ci

      - name: Typecheck generator
        working-directory: utils/generate
        run: npm exec -- tsc --noEmit

      - name: Install API dependencies
        working-directory: src/api
        run: npm ci

      - name: Typecheck API
        working-directory: src/api
        run: npm run typecheck

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: utils/generate/package-lock.json

      - name: Cache Unicode generator data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: utils/generate/unicode-data
          key: >-
            generator-data-${{ runner.os }}-${{
            hashFiles('utils/generate/scripts/generate.sh', 'src/unicode-data.h') }}

      - name: Install generator dependencies
        working-directory: utils/generate
        run: npm ci

      - name: Regenerate files
        run: make generate

      - name: Check generated files are current
        run: |
          git status --short
          git diff --exit-code
