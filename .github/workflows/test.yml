name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - label: Linux / Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - label: Linux ARM64 / GCC
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          - label: macOS / Clang
            os: macos-latest
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-unicode-test-data

      - name: Test C and C++17
        run: make test-native

  features:
    name: Test (optional features)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-unicode-test-data

      - name: Test optional-feature configurations
        run: make test-features

  sanitizers:
    name: Test (sanitizers / Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-unicode-test-data

      - name: Test sanitizer configurations
        run: make test-sanitizers

  test-windows:
    name: Test (Windows / MSVC)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-unicode-test-data

      - name: Test C, C++17, and minimal configurations
        shell: bash
        run: |
          run_test() {
            build_dir=$1
            shift
            cmake -S . -B "$build_dir" \
              "-DCMAKE_CONFIGURATION_TYPES=Debug;Release;Test" "$@"
            cmake --build "$build_dir" --config Test
            "./$build_dir/tests/Test/mojibake-test.exe"
          }

          run_test build-test
          run_test build-test-cpp -DMJB_BUILD_CPP=ON

          minimal_flags=(
            -DMJB_FEATURE_CHARACTER_NAMES=OFF
            -DMJB_FEATURE_COLLATION=OFF
            -DMJB_FEATURE_IDNA=OFF
            -DMJB_FEATURE_SECURITY=OFF
          )
          run_test build-test-minimal "${minimal_flags[@]}"
          run_test build-test-cpp-minimal -DMJB_BUILD_CPP=ON "${minimal_flags[@]}"

  wasm:
    name: WASM (Node and browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/api/package-lock.json
            utils/generate/package-lock.json

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache

      - name: Install generator dependencies
        working-directory: utils/generate
        run: npm ci

      - name: Install API dependencies
        working-directory: src/api
        run: npm ci

      - name: Build WASM
        run: make sync-api-wasm

      - name: Test Node and browser runtimes
        working-directory: src/api
        env:
          MJB_BROWSER: google-chrome
        run: npm test

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner ships a libFuzzer-capable clang, so build directly instead of via Docker.
      - name: Fuzz
        run: |
          clang -g -O1 -std=c17 -fsanitize=fuzzer,address,undefined \
            -fno-sanitize-recover=undefined -Isrc \
            -o mojibake-fuzz fuzz/fuzz.c src/*.c
          ./mojibake-fuzz -max_total_time=60 fuzz/corpus
