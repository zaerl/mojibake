name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / GCC
            os: namespace-profile-zaerl
            cc: gcc
            cxx: g++
          - label: Linux / Clang
            os: namespace-profile-zaerl
            cc: clang
            cxx: clang++
          - label: Linux ARM64 / GCC
            os: namespace-profile-zaerl-arm
            cc: gcc
            cxx: g++
          - label: macOS / Clang
            os: namespace-profile-zaerl-macos
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-unicode-test-data

      - name: Test C and strict C++17
        run: make test-native WARNINGS_AS_ERRORS=ON

      - name: Test optimized C and strict C++17
        run: make test-optimized WARNINGS_AS_ERRORS=ON

  features:
    name: Test (optional features)
    runs-on: namespace-profile-zaerl
    timeout-minutes: 10
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-unicode-test-data

      - name: Test optional-feature configurations
        run: make test-features WARNINGS_AS_ERRORS=ON

  sanitizers:
    name: Test (sanitizers / Clang)
    runs-on: namespace-profile-zaerl
    timeout-minutes: 10
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-unicode-test-data

      - name: Test sanitizer configurations
        run: make test-sanitizers WARNINGS_AS_ERRORS=ON

  rust:
    name: Test (Rust / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Test Rust crates
        run: make test-rust

      - name: Package Rust crates
        run: make package-rust

  rust-windows:
    name: Test (Rust / Windows / MSVC)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The cc crate finds MSVC itself, so no developer prompt is needed. fmt, clippy, and
      # packaging are platform-independent and run in the rust job.
      - name: Test Rust crates
        shell: bash
        working-directory: src/rust
        run: |
          cargo test --all-features
          cargo test -p mojibake-rs --no-default-features

  rust-msrv:
    name: Test (Rust / MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keep in sync with rust-version in src/rust/Cargo.toml.
      - name: Install Rust 1.77
        run: rustup toolchain install 1.77 --profile minimal

      - name: Test Rust crates
        working-directory: src/rust
        run: |
          cargo +1.77 test --locked --all-features
          cargo +1.77 test --locked -p mojibake-rs --no-default-features

  rust-docs:
    name: Rust docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # docs.rs builds with nightly and --cfg docsrs, which turns on the feature badges.
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Build docs as docs.rs does
        working-directory: src/rust
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc --no-deps --all-features --locked

  test-windows:
    name: Test (Windows / MSVC)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-unicode-test-data

      - name: Add MSVC AddressSanitizer runtime to PATH
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $visualStudio) {
              throw "Visual Studio with C++ tools was not found"
          }

          $versionFile = Join-Path $visualStudio `
            "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          $toolsetVersion = (Get-Content -Raw $versionFile).Trim()
          $asanDirectory = Join-Path $visualStudio `
            "VC\Tools\MSVC\$toolsetVersion\bin\Hostx64\x64"
          $asanRuntime = Join-Path $asanDirectory `
            "clang_rt.asan_dynamic-x86_64.dll"

          if (-not (Test-Path $asanRuntime)) {
              throw "MSVC AddressSanitizer runtime not found: $asanRuntime"
          }

          Write-Host "Using MSVC AddressSanitizer runtime: $asanRuntime"
          Add-Content -Path $env:GITHUB_PATH -Value $asanDirectory

      - name: Test C, C++17, minimal, optimized, and sanitizer configurations
        shell: bash
        run: |
          run_test() {
            build_dir=$1
            configuration=$2
            shift 2
            cmake -S . -B "$build_dir" \
              "-DCMAKE_CONFIGURATION_TYPES=Debug;Release;Test" \
              -DMJB_WARNINGS_AS_ERRORS=ON "$@"
            cmake --build "$build_dir" --config "$configuration"
            "./$build_dir/tests/$configuration/mojibake-test.exe"
          }

          run_test build-test Test
          run_test build-test-cpp Test -DMJB_BUILD_CPP=ON

          minimal_flags=(
            -DMJB_FEATURE_CHARACTER_NAMES=OFF
            -DMJB_FEATURE_COLLATION=OFF
            -DMJB_FEATURE_IDNA=OFF
            -DMJB_FEATURE_SECURITY=OFF
          )
          run_test build-test-minimal Test "${minimal_flags[@]}"
          run_test build-test-cpp-minimal Test -DMJB_BUILD_CPP=ON "${minimal_flags[@]}"
          run_test build-release Release
          run_test build-release-cpp Release -DMJB_BUILD_CPP=ON
          run_test build-test-asan Test -DMJB_USE_ASAN=ON

  wasm:
    name: WASM (Node and browser)
    runs-on: namespace-profile-zaerl
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/api/package-lock.json
            utils/generate/package-lock.json

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache

      - name: Install generator dependencies
        working-directory: utils/generate
        run: npm ci

      - name: Install API dependencies
        working-directory: src/api
        run: npm ci

      - name: Use checked-in Unicode payload
        run: touch src/unicode-data.h

      - name: Build WASM
        run: make sync-api-wasm WARNINGS_AS_ERRORS=ON

      - name: Test Node and browser runtimes
        working-directory: src/api
        env:
          MJB_BROWSER: google-chrome
        run: npm test

  fuzz:
    name: Fuzz (smoke)
    runs-on: namespace-profile-zaerl
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner ships a libFuzzer-capable clang, so build directly instead of via Docker.
      - name: Fuzz
        run: |
          clang -g -O1 -std=c17 -Werror -Wall -Wextra -pedantic-errors \
            -Wno-unused-parameter -Wtype-limits -Wshadow -Wundef -Wvla \
            -Wimplicit-fallthrough -Wnull-dereference -Wformat-security \
            -Wpointer-arith -Walloca -fno-common \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined -Isrc \
            -o mojibake-fuzz fuzz/fuzz.c src/*.c
          ./mojibake-fuzz -max_total_time=60 fuzz/corpus
