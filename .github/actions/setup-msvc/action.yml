name: Set up MSVC
description: >-
  Export the environment of an x64 Visual Studio Developer Command Prompt, so that later steps
  find cl.exe and nmake. Run it after the steps that change the PATH.

runs:
  using: composite
  steps:
    - name: Export the MSVC developer environment
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} `
          "Microsoft Visual Studio\Installer\vswhere.exe"
        $visualStudio = & $vswhere -latest -products '*' `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath

        if (-not $visualStudio) {
            throw "Visual Studio with C++ tools was not found"
        }

        $vcvars = Join-Path $visualStudio "VC\Auxiliary\Build\vcvars64.bat"
        $environment = cmd /c "`"$vcvars`" > nul && set"

        if ($LASTEXITCODE -ne 0) {
            throw "$vcvars failed"
        }

        foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
                Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
        }

        Write-Host "Using MSVC from $visualStudio"
