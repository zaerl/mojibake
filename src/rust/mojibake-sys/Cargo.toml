[package]
name = "mojibake-sys"
description = "Raw FFI bindings to the Mojibake Unicode library"
links = "mojibake"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["names", "collation", "idna", "security"]
# Each feature maps to the matching MJB_FEATURE_* compile option of the C library.
names = []
collation = []
idna = []
security = []

[build-dependencies]
cc = "1.0"
